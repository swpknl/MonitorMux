name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MonitorMux.csproj

      - name: Build
        run: dotnet build MonitorMux.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish MonitorMux.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path publish\MonitorMux.exe -DestinationPath MonitorMux-win-x64.zip

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: MonitorMux-win-x64.zip
          generate_release_notes: true
