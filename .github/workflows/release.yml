name: Build and Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Determine next version
        id: version
        shell: bash
        run: |
          git fetch --tags --force
          latest=$(git tag -l "v*.*.*" | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            new_tag="v1.0.0"
          else
            ver=${latest#v}
            IFS='.' read -r major minor patch <<< "$ver"
            new_tag="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Latest tag: ${latest:-none}, new tag: $new_tag"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Restore
        run: dotnet restore MonitorMux.csproj

      - name: Build
        run: dotnet build MonitorMux.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish MonitorMux.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path publish\MonitorMux.exe -DestinationPath MonitorMux-win-x64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: MonitorMux-win-x64.zip
          generate_release_notes: true
